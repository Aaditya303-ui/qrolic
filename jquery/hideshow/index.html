    <p id="panel">I am a panel</p>
    <button id="up">up</button>
    <button id="down">down</button>
    <button id="toggle">toggle</button>
  </body>
  <script>
    $(document).ready(function(){
        $("#up").click(function(){
            $("#panel").slideUp();
        });
        $("#down").click(function(){
            $("#panel").slideDown();
        });
        $("#toggle").click(function(){
            $("#panel").slideToggle();
        });
    })
  </script>
