<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Slick Slider</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Slick CSS -->
    <link
        rel="stylesheet"
        type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css"
    />

    <!-- Slick Theme CSS -->
    <link
        rel="stylesheet"
        type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css"
    />
</head>

<body>

    <h2>Slick Carousel</h2>

    <div class="slider">

        <div>
            <h3>Slide 1</h3>
        </div>

        <div>
            <h3>Slide 2</h3>
        </div>

        <div>
            <h3>Slide 3</h3>
        </div>

        <div>
            <h3>Slide 4</h3>
        </div>

        <div>
            <h3>Slide 5</h3>
        </div>

    </div>


    <!-- Slick JS -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js">
    </script>


    <script>

        $(document).ready(function () {

            $(".slider").slick({

                autoplay: true,

                autoplaySpeed: 2000,

                dots: true,

                slidesToShow: 3,

                slidesToScroll: 1,

                responsive: [

                    {
                        breakpoint: 768,

                        settings: {
                            slidesToShow: 2
                        }
                    },

                    {
                        breakpoint: 480,

                        settings: {
                            slidesToShow: 1
                        }
                    }

                ]

            });

        });

    </script>

</body>

</html>
